[package]
name = "viewfrx-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.packager]
product-name = "viewfrx"
identifier = "io.jesdev.viewfrx"
authors = ["JESDEV"]
category = "Music"
description = "A fast audio file browser and player"
icons = ["assets/viewfrx-icon.png"]
formats = ["deb", "appimage"]
out-dir = "../../target/release/bundle"
binaries-dir = "../../target/release"
binaries = [{ path = "viewfrx-gui", main = true }]

[package.metadata.packager.deb]
depends = ["libasound2"]

[[bin]]
name = "viewfrx-gui"
path = "src/main.rs"

[features]
default = []
spectrogram = ["viewfrx-core/spectrogram"]

[dependencies]
viewfrx-core = { path = "../viewfrx-core" }
viewfrx-audio = { path = "../viewfrx-audio" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["webp", "png"] }

tempfile.workspace = true

[dev-dependencies]
hound.workspace = true
