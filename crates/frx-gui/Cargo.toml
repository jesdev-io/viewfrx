[package]
name = "frx-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "frxview-gui"
path = "src/main.rs"

[features]
default = []
spectrogram = ["frx-core/spectrogram"]

[dependencies]
frx-core = { path = "../frx-core" }
frx-audio = { path = "../frx-audio" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["webp", "png"] }

[dev-dependencies]
tempfile.workspace = true
hound.workspace = true
