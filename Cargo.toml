[workspace]
members = ["crates/frx-core", "crates/frx-audio", "crates/frx-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
symphonia = { version = "0.5.5", features = ["all"] }
cpal = "0.16"
rtrb = "0.3"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
blake3 = "1"
tempfile = "3"
hound = "3.5"

[profile.release]
lto = "thin"
codegen-units = 1
