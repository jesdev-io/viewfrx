name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: write # release job uploads binaries to tag releases

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux audio dev headers (CPAL/ALSA)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (spectrogram feature)
        run: cargo clippy --workspace --all-targets --features spectrogram --locked -- -D warnings
      - name: Tests (default features)
        run: cargo test --workspace --locked
      - name: Tests (spectrogram feature)
        run: cargo test --workspace --features spectrogram --locked
      - name: Release build
        run: cargo build --release --workspace --features spectrogram --locked
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: viewfrx-${{ matrix.os }}
          path: |
            target/release/viewfrx*
            !target/release/*.d
            !target/release/*.pdb
          if-no-files-found: error

  release:
    name: Release (tag ${{ github.ref_name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download binaries from all platforms
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: viewfrx-*
      - name: Package per-platform archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for d in dist/viewfrx-*/; do
            os=$(basename "$d" | sed 's/^viewfrx-//')
            stage="release/viewfrx-$os"
            mkdir -p "$stage"
            for binary in viewfrx viewfrx.exe viewfrx-gui viewfrx-gui.exe; do
              if [[ -f "$d/$binary" ]]; then cp "$d/$binary" "$stage/"; fi
            done
            cp README.md LICENSE "$stage/"
            if [[ "$os" == "Windows" ]]; then
              (cd release && 7z a -tzip "viewfrx-$os.zip" "viewfrx-$os" >/dev/null)
            else
              tar -czf "release/viewfrx-$os.tar.gz" -C release "viewfrx-$os"
            fi
          done
          cd release
          sha256sum viewfrx-*.* > SHA256SUMS
          ls -la
      - name: Publish GitHub release (binaries + source code)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
          generate_release_notes: true
