name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: write # release job uploads binaries to tag releases

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux audio dev headers (CPAL/ALSA)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (spectrogram feature)
        run: cargo clippy --workspace --all-targets --features spectrogram --locked -- -D warnings
      - name: Tests (default features)
        run: cargo test --workspace --locked
      - name: Tests (spectrogram feature)
        run: cargo test --workspace --features spectrogram --locked
      - name: Release build
        run: cargo build --release --workspace --features spectrogram --locked
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Install AppImage tooling
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          sudo mv appimagetool.AppImage /usr/local/bin/appimagetool
      - name: Build Linux desktop packages
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo packager --release --packages viewfrx-gui --formats deb,appimage
      - name: Build Windows MSI
        if: runner.os == 'Windows'
        run: cargo packager --release --packages viewfrx-gui --formats wix
      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: cargo packager --release --packages viewfrx-gui --formats dmg
      - name: Upload native desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: native-packages-${{ matrix.os }}
          path: |
            target/release/bundle/*.deb
            target/release/bundle/*.AppImage
            target/release/bundle/*.msi
            target/release/bundle/*.dmg
          if-no-files-found: error
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: viewfrx-${{ matrix.os }}
          path: |
            target/release/viewfrx*
            !target/release/*.d
            !target/release/*.pdb
          if-no-files-found: error

  release:
    name: Release (tag ${{ github.ref_name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download binaries from all platforms
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: viewfrx-*
      - name: Download native desktop packages
        uses: actions/download-artifact@v4
        with:
          path: native-dist
          pattern: native-packages-*
          merge-multiple: true
      - name: Package per-platform archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp native-dist/* release/
          for d in dist/viewfrx-*/; do
            os=$(basename "$d" | sed 's/^viewfrx-//')
            stage="release/viewfrx-$os"
            mkdir -p "$stage"
            for binary in viewfrx viewfrx.exe viewfrx-gui viewfrx-gui.exe; do
              if [[ -f "$d/$binary" ]]; then cp "$d/$binary" "$stage/"; fi
            done
            cp README.md LICENSE "$stage/"
            if [[ "$os" == windows-* ]]; then
              python3 - "$stage" "release/viewfrx-$os.zip" <<'PY'
          import pathlib, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(sys.argv[2], "w", zipfile.ZIP_DEFLATED) as archive:
              for path in root.rglob("*"):
                  if path.is_file():
                      archive.write(path, path.relative_to(root.parent))
          PY
            else
              tar -czf "release/viewfrx-$os.tar.gz" -C release "viewfrx-$os"
            fi
          done
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          ls -la
      - name: Publish GitHub release (binaries + source code)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/*.zip
            release/*.deb
            release/*.AppImage
            release/*.msi
            release/*.dmg
            release/SHA256SUMS
          generate_release_notes: true
